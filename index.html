<style>
/* Layout: fixed left rail of navigation + a reading column; rail collapses to a drawer under 900px. */
:root {

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1513; --surface: #16201d; --surface-2: #1d2a26; --line: #2a3a35;

  --gold: #e2aa50; --good: #5fcb8c; --bad: #f07a70; --warn: #e8b34c;
  --l1: #5bbfa9; --l2: #77a6dc; --l3: #a990d8; --l4: #e39360; --l5: #d77796;

:root[data-theme="dark"] {
  --bg: #0e1513; --surface: #16201d; --surface-2: #1d2a26; --line: #2a3a35;
  --ink: #e4ede9; --muted: #98aaa3; --accent: #4cc3a5; --accent-ink: #062019; --accent-soft: #173a31;
  --gold: #e2aa50; --good: #5fcb8c; --bad: #f07a70; --warn: #e8b34c;
  --l1: #5bbfa9; --l2: #77a6dc; --l3: #a990d8; --l4: #e39360; --l5: #d77796;

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-ui); -webkit-font-smoothing: antialiased; }

.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* App frame */
.app { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.rail { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line);
  padding: max(18px, env(safe-area-inset-top, 0px)) 14px 18px max(14px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); padding: 0 6px; }
.brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 800; letter-spacing: -.02em; }
.brand b { display: block; font-size: 15px; letter-spacing: -.01em; }
.brand small { color: var(--muted); font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; }
.nav { display: flex; flex-direction: column; gap: 2px; }

.rail-foot { margin-top: auto; display: flex; gap: 8px; padding: 0 4px; }

.stat-chip b { display: block; font-family: var(--font-num); font-size: 16px; }
.stat-chip span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.icon-btn.menu-btn { display: none; }
.search { position: relative; flex: 1; max-width: 520px; }
.search input { width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 14px 8px 36px; }
.search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); max-height: 60vh; overflow-y: auto; z-index: 20; }
.results a { display: block; padding: 10px 14px; text-decoration: none; color: var(--ink); border-bottom: 1px solid var(--line); }
.results a:last-child { border-bottom: 0; }
.results a:hover, .results a.hi { background: var(--surface-2); }
.results small { color: var(--muted); display: block; }
.icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; width: 38px; height: 38px; display: grid; place-items: center; cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

.view { padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); width: 100%; max-width: 1080px; margin: 0 auto; display: flex; flex-direction: column; gap: 26px; }
.eyebrow { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.h1 { font-size: clamp(26px, 3.4vw, 36px); letter-spacing: -.02em; font-weight: 700; }
.h2 { font-size: 20px; letter-spacing: -.01em; font-weight: 700; }
.lede { color: var(--muted); max-width: 66ch; margin: 6px 0 0; font-size: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel h3 { font-size: 16px; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.btn { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 9px 16px; cursor: pointer; text-decoration: none; font-weight: 600; font-size: 14px; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--c, var(--accent)); border-radius: 99px; transition: width .4s ease; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; background: var(--surface-2); color: var(--muted); }
.pill.good { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent); }
.pill.lvl { color: #fff; background: var(--c); }

/* Hero / dashboard */
.hello { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 14px; }
.continue { background: var(--accent); color: var(--accent-ink); border: 0; display: flex; flex-direction: column; gap: 12px; justify-content: space-between; }

.rung:hover { border-color: var(--c); }
.rung .code { font-family: var(--font-num); font-weight: 700; font-size: 20px; color: var(--c); border: 2px solid var(--c); border-radius: 8px; height: 48px; display: grid; place-items: center; }

.rung .prog { display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: var(--muted); }
.rung.rec { box-shadow: 0 0 0 2px var(--c); }

/* Level page */
.level-head { border-left: 5px solid var(--c); padding-left: 16px; display: flex; flex-direction: column; gap: 6px; }
.module { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.module-head { padding: 16px 18px; display: flex; gap: 14px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
.module-head h3 { font-size: 17px; }
.module-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.lesson-row { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line); text-decoration: none; color: var(--ink); }
.lesson-row:last-child { border-bottom: 0; }
.lesson-row:hover { background: var(--surface-2); }
.lesson-row .tick { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 12px; color: transparent; }
.lesson-row.done .tick { background: var(--good); border-color: var(--good); color: #fff; }
.lesson-row .t { flex: 1; min-width: 0; }
.lesson-row .m { font-size: 12.5px; color: var(--muted); white-space: nowrap; }

/* Lesson reader */
.crumbs { font-size: 13px; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); }
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 28px; align-items: start; }
.prose { font-family: var(--font-read); font-size: 17px; line-height: 1.7; max-width: 68ch; min-width: 0; }
.prose h2 { font-family: var(--font-ui); font-size: 20px; margin: 30px 0 8px; }
.prose h3 { font-family: var(--font-ui); font-size: 17px; margin: 22px 0 6px; }
.prose p { margin: 0 0 14px; }
.prose ul, .prose ol { padding-left: 22px; margin: 0 0 14px; }
.prose li { margin: 4px 0; }
.prose blockquote { margin: 18px 0; padding: 12px 16px; background: var(--accent-soft); border-radius: 8px; font-family: var(--font-ui); font-size: 15.5px; font-weight: 500; }
.prose .tbl { overflow-x: auto; margin: 0 0 16px; border: 1px solid var(--line); border-radius: 8px; }

.prose th, .prose td { padding: 8px 12px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: top; }
.prose th { background: var(--surface-2); font-weight: 600; }
.prose tr:last-child td { border-bottom: 0; }
.side { position: sticky; top: 80px; display: flex; flex-direction: column; gap: 14px; }
.side ul { margin: 6px 0 0; padding-left: 18px; font-size: 14px; }
.side textarea { width: 100%; min-height: 140px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 10px; resize: vertical; font-size: 14px; }
.takeaways { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; font-family: var(--font-ui); }
.takeaways ul { margin: 8px 0 0; padding-left: 20px; }
.activity { border: 1px dashed var(--accent); border-radius: var(--r); padding: 16px 18px; font-family: var(--font-ui); }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

/* Quiz */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.q h3 { font-size: 16px; font-weight: 600; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 10px 12px; cursor: pointer; width: 100%; }
.opt:hover:not([disabled]) { border-color: var(--accent); }
.opt .k { font-family: var(--font-num); font-weight: 700; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }

.explain { font-size: 14px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 10px; }
.score { font-family: var(--font-num); font-size: 44px; font-weight: 700; letter-spacing: -.03em; }

/* Toolkit */
.calc label { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); }
.calc input { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 8px 10px; font-family: var(--font-num); color: var(--ink); width: 100%; }

pre.tpl { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; overflow-x: auto; font-family: var(--font-num); font-size: 12.5px; line-height: 1.55; white-space: pre; margin: 10px 0 0; max-height: 360px; }

/* Flashcards */
.card-stage { display: flex; flex-direction: column; align-items: center; gap: 16px; }
.flash { width: min(560px, 100%); min-height: 240px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 28px; display: grid; place-items: center; text-align: center; cursor: pointer; }

.boxes { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

/* Glossary */
.gloss { display: grid; grid-template-columns: 200px minmax(0, 1fr); border-top: 1px solid var(--line); }

/* Certificate */
.cert { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: clamp(24px, 5vw, 56px); text-align: center; position: relative; outline: 6px double var(--c); outline-offset: -18px; display: flex; flex-direction: column; gap: 14px; align-items: center; }

/* Onboarding modal */
.scrim { position: fixed; inset: 0; background: rgba(8,16,14,.55); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--surface); border-radius: 14px; padding: 26px; width: min(520px, 100%); display: flex; flex-direction: column; gap: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-height: 90vh; overflow-y: auto; }
.modal label { display: flex; flex-direction: column; gap: 5px; font-size: 13px; color: var(--muted); }
.modal input, .modal select, .field { border: 1px solid var(--line); background: var(--bg); border-radius: 8px; padding: 9px 12px; color: var(--ink); width: 100%; }

.toast { position: fixed; bottom: max(20px, calc(env(safe-area-inset-bottom, 0px) + 12px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 99px; font-weight: 600; z-index: 60; box-shadow: var(--shadow); }

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }

  .app { display: block; } .view { padding: 0; }
}

  audience: 'Fresh graduates · HR assistants & coordinators · 0–2 years',
  blurb: 'How HR works, the employee lifecycle, hiring and onboarding basics, records, payroll and the legal ground rules every HR professional must know.',
  modules: [
    {

          body: `HR exists to help the organisation get the right people, in the right roles, performing and growing, at a sustainable cost and within the law. Everything else is a means to that end.

## The three-pillar model
Most mid-size and large organisations organise HR around the model popularised by Dave Ulrich:

- **HR Business Partners (HRBPs)** sit with business leaders and translate business goals into people priorities.
- **Centres of Excellence (CoEs)** hold deep expertise: talent acquisition, reward, learning, organisation development, employee relations, people analytics.
- **HR Shared Services / People Operations** deliver transactional work at scale: onboarding paperwork, payroll inputs, data changes, employee queries, often through a portal or chatbot.

In 2026 a fourth layer is common: **HR technology and AI**, which owns the HRIS, self-service, automation and AI assistants that handle routine questions.

## Where you fit
Entry roles (HR Assistant, Coordinator, People Ops Associate, Recruitment Coordinator) usually sit in shared services or support a CoE. Your work is the foundation: if data is wrong or an offer letter is late, the strategy above you fails.

> Credibility in HR is built on accuracy and follow-through first, and on ideas second.

## The seven stages
1. **Attract** – employer brand, careers site, referrals.
2. **Recruit** – requisition, sourcing, screening, interviews, offer.
3. **Onboard** – pre-boarding, day one, first 90 days.
4. **Develop** – learning, coaching, career moves.
5. **Perform** – goals, feedback, reviews, recognition.

          body: `HR holds the most sensitive information in the company: salaries, health conditions, disciplinary records, investigations, home addresses. Trust is your licence to operate.

## Core data protection principles
Most privacy laws (GDPR in Europe, DPDP Act in India, CCPA/CPRA in California, PDPA in Singapore) share the same ideas:

- **Lawful purpose** – collect data only for a clear, legitimate reason.
- **Minimisation** – collect no more than you need.
- **Accuracy** – keep it correct and up to date.
- **Storage limitation** – delete it when the retention period ends.
- **Security** – restrict access; never email unprotected spreadsheets of personal data.
- **Rights** – employees can usually access and correct their data.

## Everyday confidentiality
- Discuss individual cases only with people who need to know.
- Lock your screen. Do not leave printouts on the printer.
- Never paste employee personal data into public AI tools. Use only company-approved tools.
- If a colleague asks "is X being fired?", the answer is "I can’t discuss other employees."

## An ethical decision check
When something feels wrong, ask:
1. Is it legal and in line with policy?
2. Would I be comfortable if this appeared in the news or in front of the employee?
3. Is it fair and consistent with how others were treated?
4. Who should I escalate to?

- **Job title** – use the market-standard title people actually search for.
- **Purpose** – one or two sentences on why the role exists.
- **Key responsibilities** – 5–8 outcome-focused bullets ("Reduce invoice errors by…", not "Responsible for invoices").
- **Requirements** – split into *must-have* (3–5 items) and *nice-to-have*.
- **Skills over credentials** – ask "does this role truly need a degree?" Skills-based hiring widens the talent pool.

## Screening
Screen against the must-have criteria only. Use a simple yes / no / maybe grid and record reasons. If AI screening tools are used, HR must know what criteria they apply and check for bias.

## Building a structured interview
1. Identify 4–6 competencies from the job description.

## Question types
- **Behavioural:** "Tell me about a time you had to deliver bad news to a customer. What did you do?" Use the **STAR** structure to probe: Situation, Task, Action, Result.

          body: `The Human Resources Information System (HRIS) is the system of record for employee data. Examples include Workday, SAP SuccessFactors, Oracle HCM, Darwinbox, HiBob, BambooHR and Personio.

## Core employee data
- Personal details: legal name, date of birth, address, emergency contact.
- Job data: position, grade, department, manager, location, FTE, contract type.
- Pay data: salary, allowances, bank details, tax identifiers.
- Lifecycle events: hire, transfer, promotion, leave, termination, each with an **effective date**.

## Why effective dates matter
A promotion entered with the wrong effective date causes wrong pay, wrong reports and wrong history. Always check effective date, reason code and approval before saving.

## Self-service
Employees update their own address or bank details; managers approve leave and initiate changes. HR’s role shifts to checking quality and fixing exceptions.

## Data quality habits
- Use dropdowns and standard codes, never free text, for fields used in reporting.
- Run a monthly audit: missing managers, employees without a cost centre, leavers still active.

          obj: ['Explain gross-to-net pay', 'Describe the payroll cycle and cut-off', 'Name common benefits'],
          body: `Payroll is the HR process employees notice most. Errors hurt trust immediately.

## Gross to net
**Gross pay** = base salary + allowances + overtime + bonuses.
**Deductions** = income tax withheld + social security or provident fund contributions + pension or retirement contributions + other deductions (loans, benefits).
**Net pay** = gross pay − deductions.

Employers also pay **employer contributions** (social security, pension, insurance) that do not appear in net pay but are part of employment cost.

## The payroll cycle
1. **Inputs** – new hires, leavers, changes, overtime, leave without pay.
2. **Cut-off date** – changes after this go to next month.
3. **Processing and validation** – variance check against last month.
4. **Approval** – finance and HR sign-off.
5. **Payment and payslips.**
6. **Statutory filings** – tax and contribution returns to authorities.

## Variance checks
Compare this month to last month. Investigate any employee whose net pay changed by more than about 10% without a known reason.

## Common benefits
Health insurance, retirement plans, life and disability cover, paid leave, meal or transport allowances, wellbeing programmes, learning budgets, and flexible benefits where employees choose from a menu.

> Never promise an employee a payroll change "this month" until you have checked the cut-off.`,

          body: `Employment law varies by country and even by state, but the same themes appear almost everywhere. Always confirm details against local law and your legal team.

## The main areas
- **Employment contracts** – written terms covering role, pay, hours, notice, probation, confidentiality.
- **Working time** – maximum hours, rest breaks, overtime pay, night work.
- **Minimum wage** – statutory floors that change annually.
- **Leave** – annual leave, sick leave, maternity, paternity and parental leave, public holidays.
- **Anti-discrimination** – equal treatment in hiring, pay, promotion and dismissal.
- **Health and safety** – a duty of care for physical and psychological safety.
- **Termination** – notice, fair reasons, due process, severance.
- **Data privacy** – lawful processing of employee data.

## Protected characteristics
Commonly protected: sex, gender identity, race, ethnicity, colour, religion, age, disability, sexual orientation, pregnancy and maternity, marital status, national origin. Some jurisdictions add caste, genetic information or political opinion.

## Employee vs contractor
Misclassifying employees as contractors exposes the company to back pay, tax and penalties. Tests usually look at control, integration, financial dependency and who provides the tools.

## Harassment
Most jurisdictions require employers to prevent and respond to harassment, including sexual harassment. Some require a formal internal committee (for example India’s POSH Act).

          body: `HR receives a steady stream of questions: leave balances, payslips, policies, letters, personal issues. How you handle them shapes how employees see HR.

## Tiered service model
- **Tier 0 – self-service:** portal, knowledge base, AI assistant.
- **Tier 1 – HR service desk:** standard questions answered within service level agreements.
- **Tier 2 – specialists:** payroll, benefits, immigration, employee relations.
- **Tier 3 – CoE / legal:** complex or high-risk cases.

## The case approach
1. **Log** every query with a reference number.
2. **Classify** by category and urgency.
3. **Respond** with a clear answer, or an acknowledgement and an expected date.
4. **Resolve and confirm** the employee is satisfied.
5. **Learn** – if the same question comes up often, fix the knowledge article or the process.

## Writing good responses
- Start with the answer, then the explanation.
- Use plain language and link to the policy.
- Show empathy when the issue is personal: "I’m sorry to hear about your father. Here’s how bereavement leave works…"

Allegations of harassment, discrimination, fraud or safety risk; mentions of self-harm; legal threats; requests from lawyers or authorities; anything involving a senior leader.

## Core policies most companies have
- Code of conduct and ethics
- Equal opportunity, anti-harassment and anti-bullying
- Leave and attendance
- Working hours, remote and hybrid work
- Grievance and disciplinary procedures
- Data protection and IT acceptable use, including generative AI use
- Expenses and travel
- Whistleblowing and speak-up
- Health, safety and wellbeing

## Writing policies people read
- Short sections, plain language, real examples.
- Say who it applies to, what the rule is, how to get help.
- Version control: date, owner and review cycle (usually annual).

## Consistency vs discretion
Apply the policy the same way to everyone in the same situation. Where the policy gives discretion (for example compassionate leave), document the reason for your decision so you can apply it the same way next time.

          body: `Numbers give HR credibility with business leaders. Start with a handful of core metrics and calculate them correctly.

## Core formulas
| Metric | Formula |
|---|---|
| Headcount | Number of employees on a given date |
| FTE | Sum of contracted hours ÷ standard full-time hours |
| Attrition rate (annual) | Leavers in 12 months ÷ average headcount × 100 |
| Voluntary attrition | Resignations ÷ average headcount × 100 |
| Absence rate | Days absent ÷ total scheduled working days × 100 |
| Time to fill | Days from requisition approval to offer acceptance |
| Offer acceptance rate | Offers accepted ÷ offers made × 100 |

**Average headcount** = (headcount at start + headcount at end) ÷ 2, or the average of monthly figures for more accuracy.

## Worked example
Start of year: 480 employees. End of year: 520. Leavers during year: 75.
Average headcount = (480 + 520) ÷ 2 = 500. Attrition = 75 ÷ 500 × 100 = **15%**.

## Spreadsheet skills to build
- Filters, sorting and pivot tables
- XLOOKUP / VLOOKUP to join data
- COUNTIFS and SUMIFS for metrics by department
- Simple charts: one message per chart

> Always state the period, the population and the definition. "15% voluntary attrition, last 12 months, permanent staff only" is a usable number. "15% turnover" is not.`,

## A typical funnel
| Stage | Example volume | Conversion |
|---|---|---|

- **Time to fill** – requisition approval to offer accepted.

          id: '3', t: 'Selection science & fair assessment', mins: 14,
          obj: ['Compare the predictive validity of selection methods', 'Combine methods for better decisions', 'Reduce adverse impact'],
          body: `Some selection methods predict job performance much better than others. Decades of research (summarised in meta-analyses such as Schmidt & Hunter, updated by Sackett and colleagues in 2022) give a clear ranking.

## Relative validity (approximate)
| Method | Predictive power |
|---|---|
| Structured interviews | High |
| Job knowledge tests | High |
| Work samples / job simulations | Moderate to high |
| Cognitive ability tests | Moderate (with adverse-impact risk) |
| Integrity / conscientiousness measures | Moderate |
| Unstructured interviews | Low to moderate |
| Years of experience | Low |
| Education level | Low |
| Graphology, astrology | None |

## Combining methods
No single tool is enough. A strong process combines a structured interview with a work sample or job knowledge test, then makes a decision using pre-agreed weightings.

## Adverse impact
A selection step has adverse impact when one group passes at a much lower rate than another. A common check is the **four-fifths rule**: if a group’s selection rate is less than 80% of the highest group’s rate, investigate.

Example: 50% of men pass a test but only 30% of women. 30 ÷ 50 = 60%, below 80%, so investigate.

## AI-assisted assessment
AI screening and video-analysis tools must be validated for job-relatedness and audited for bias. New York City requires bias audits of automated employment decision tools, and under the EU AI Act hiring AI is classed as high-risk.

> Valid and fair are not in tension. Structured, job-related methods tend to be both.`,

    {
      id: 'm2', title: 'Employee Relations',
      summary: 'Grievances, investigations, discipline, performance improvement and exits done right.',

          id: '1', t: 'Grievances & workplace investigations', mins: 15,
          obj: ['Run a fair grievance process', 'Plan and conduct an investigation', 'Write an evidence-based investigation report'],
          body: `When an employee raises a concern, how HR responds determines whether trust grows or breaks. Fair process is your best protection, legally and culturally.

## Grievance process
1. **Receive** the complaint in writing or record it accurately.
2. **Acknowledge** quickly and explain next steps and timescales.
3. **Assess** – informal resolution, formal grievance or investigation?
4. **Meet** the employee; they may have the right to be accompanied.
5. **Decide** and communicate the outcome in writing with reasons.
6. **Appeal** – offer a route to someone not previously involved.

## Investigation principles
- **Independence** – the investigator has no conflict of interest.
- **Confidentiality** – shared on a need-to-know basis; no promises of total secrecy.
- **Promptness** – delays damage evidence and wellbeing.
- **No pre-judgement** – gather facts before conclusions.
- **Non-retaliation** – make clear that retaliation is itself misconduct.

## Running interviews
Interview the complainant, the respondent, then witnesses. Use open questions ("What happened next?"), avoid leading ones ("He shouted at you, didn’t he?"). Take careful notes and have them reviewed.

## The report
- Allegations, one by one
- Evidence gathered (interviews, emails, CCTV, system logs)
- Findings on each allegation using the **balance of probabilities** standard (more likely than not)
- Recommendations, not sanctions; the decision-maker decides

> Separate the investigator from the decision-maker wherever possible.`,

          obj: ['Distinguish misconduct from capability problems', 'Apply progressive discipline fairly', 'Design an effective performance improvement plan'],
          body: `Two different problems need two different processes. **Misconduct** is "won’t" (breaking rules). **Capability or performance** is "can’t" (not meeting the standard despite effort).

## Progressive discipline (misconduct)
1. Informal conversation
2. Verbal warning (recorded)
3. First written warning
4. Final written warning
5. Dismissal

**Gross misconduct** (theft, violence, serious harassment, fraud) can justify skipping steps, but still needs investigation and a hearing.

Every stage needs: a clear allegation in advance, evidence shared, a chance to respond, the right to be accompanied where applicable, a written outcome and a right of appeal.

## Performance improvement plan (PIP)
A PIP should genuinely aim to help someone succeed.

- **The gap** – specific examples of where performance falls short.
- **The standard** – what good looks like, in measurable terms.
- **Support** – training, coaching, more frequent check-ins, resources.
- **Timeline** – typically 30 to 90 days.
- **Review points** – weekly or fortnightly, documented.
- **Consequences** – stated clearly but without threat.

## Check for underlying causes first
Health issues, disability, caring responsibilities, unclear expectations, poor tools or a difficult manager relationship. Consider reasonable adjustments.

> A PIP that surprises the employee is a management failure. Feedback should have come months earlier.`,

## Before a termination
- Confirm the legal basis, process followed and documentation with ER or legal.
- Check for protected situations: pregnancy, recent whistleblowing, sick leave, union activity.
- Prepare the letter, final pay calculation, benefits information and any settlement offer.
- Plan logistics: time, private room or video call, IT access removal, how belongings are returned.

## The meeting
- Keep it short: 10–15 minutes.
- The manager delivers the message clearly in the first two minutes. HR covers next steps.
- Do not debate the decision. Acknowledge emotions.
- Give written details: last day, final pay, benefits, references, return of property, support services.

## Offboarding checklist
Revoke system access, recover equipment, process final pay and accrued leave, issue required documents (experience or service letter where customary), update the HRIS, arrange knowledge transfer.

## Exit interviews
Ask for voluntary leavers: why are you leaving, what could have kept you, how was your manager? Analyse themes quarterly, by manager and department. Consider a "stay interview" with current high performers before they leave.

          obj: ['Write SMART goals and OKRs', 'Coach managers on regular check-ins', 'Teach a feedback model'],
          body: `Performance management has moved from an annual form-filling exercise towards continuous conversations. The form matters less than the quality of the conversation.

## SMART goals
Specific, Measurable, Achievable, Relevant, Time-bound.
- Weak: "Improve customer service."
- SMART: "Raise the customer satisfaction score from 78 to 85 by the end of Q3 by introducing a 24-hour response standard."

## OKRs
**Objective** – qualitative and inspiring. **Key results** – 2–4 measurable outcomes.
- Objective: Make onboarding the best first experience in our industry.
- KR1: New-hire 30-day survey score rises from 7.1 to 8.5.
- KR2: 95% of hires have equipment and access on day one.
- KR3: 90-day regretted attrition falls below 3%.

OKRs often aim for 70% achievement and are best kept separate from bonus decisions so people set ambitious goals.

## Check-ins
Fortnightly or monthly 1:1s focused on progress, obstacles, support needed and development. Short, regular and owned by the employee.

## Feedback models
**SBI** – Situation, Behaviour, Impact. "In yesterday’s client call (S), you interrupted the client three times (B). They seemed frustrated and cut the call short (I)." Then ask: "What’s your view?"

Encourage feedback in both directions and recognise good work specifically and quickly.

> The best predictor of team performance is the quality and frequency of manager–employee conversations.`,

          id: '2', t: 'Performance reviews & calibration', mins: 13,
          obj: ['Run fair performance reviews', 'Facilitate calibration sessions', 'Reduce rating bias'],
          body: `Reviews summarise performance and inform pay, promotion and development decisions. Because the stakes are high, fairness is essential.

## A good review covers
- **What** was achieved against goals.
- **How** it was achieved, measured against values and competencies.
- **Development** – strengths, growth areas, career aspirations.
- **Evidence** – examples from across the whole period, not just recent weeks.

## Rating scales
Most companies use 3–5 point scales. Forced distribution (fixed quotas per rating) has largely been abandoned because it damages collaboration, but calibration keeps ratings meaningful.

## Calibration
Managers meet, usually facilitated by HR, to compare proposed ratings across teams before finalising them.

HR’s role as facilitator:
- Share the rating distribution by team and demographic group before the session.
- Ask for evidence: "What specific outcomes support an 'exceeds' rating?"
- Challenge outliers: a manager who rates everyone highly, or a group consistently rated lower.
- Keep time and record decisions with reasons.

## Common rating errors
| Error | Description |
|---|---|
| Recency | Overweighting the last few weeks |
| Leniency / severity | Rating everyone too high or too low |
| Central tendency | Rating everyone in the middle |
| Similar-to-me | Favouring people like the rater |
| Proximity | Favouring people seen in the office over remote staff |

> Look at ratings by gender, ethnicity, age, part-time status and work location every cycle. Gaps are a signal to investigate.`,

          id: '3', t: 'Designing learning that works', mins: 14,
          obj: ['Apply the ADDIE design model', 'Use 70-20-10 to blend learning', 'Evaluate learning with Kirkpatrick’s four levels'],
          body: `Learning and development (L&D) exists to close capability gaps that matter to the business, not to fill a training calendar.

## Start with a needs analysis
Ask: what business problem are we solving? What do people need to do differently? Is it really a skill gap, or a process, tools, motivation or management problem? Training cannot fix a broken process.

## ADDIE
1. **Analyse** – audience, gap, desired behaviour.
2. **Design** – objectives, format, assessment.
3. **Develop** – content, activities, materials.
4. **Implement** – deliver and support.
5. **Evaluate** – measure impact and improve.

Agile alternatives like SAM (Successive Approximation Model) prototype quickly and iterate.

## The 70-20-10 guideline
- **70%** learning on the job: stretch assignments, projects, rotations.
- **20%** learning from others: coaching, mentoring, feedback.
- **10%** formal learning: courses, e-learning, workshops.

It is a guideline, not a law. The point is that a course alone rarely changes behaviour.

## Kirkpatrick’s four levels of evaluation
| Level | Question |
|---|---|
| 1. Reaction | Did they find it useful? |
| 2. Learning | Did they gain knowledge or skill? |
| 3. Behaviour | Are they applying it on the job? |
| 4. Results | Did business outcomes improve? |

## Learning in 2026
AI tutors, skills-based learning platforms, micro-learning in the flow of work, and learning paths tied to a skills taxonomy.

> Agree the level-4 business metric with the sponsor before you design anything.`,

      id: 'm4', title: 'Reward Basics & HR Analytics',

        {
          id: '1', t: 'Job evaluation & pay structures', mins: 15,
          obj: ['Explain job evaluation methods', 'Build and read a pay range', 'Calculate compa-ratio and range penetration'],
          body: `Fair pay starts with knowing the relative value of jobs and the market rate for them.

## Job evaluation
- **Ranking** – simple ordering of jobs; fine for small companies.
- **Job classification / grading** – jobs placed into grades by descriptions.
- **Point-factor** – jobs scored on factors such as knowledge, problem-solving, accountability and impact. Proprietary versions include Korn Ferry Hay, Mercer IPE and WTW GGS.

## Market pricing
Match your jobs to salary survey benchmarks (Mercer, WTW, Aon Radford, Korn Ferry, local providers). Use the **median (P50)** as a typical reference point, with P25 and P75 for context.

## Pay ranges
A range has a **minimum**, **midpoint** and **maximum**.
- **Range spread** = (max − min) ÷ min. Typically 30–50% for junior grades and 50–80% for senior grades.
- The midpoint usually reflects your target market position, such as market P50.

## Two key ratios
**Compa-ratio** = salary ÷ range midpoint.
- 0.80–0.90: new to role or underpaid
- 0.95–1.05: fully competent, at market
- above 1.10: very experienced, or a possible red flag

**Range penetration** = (salary − min) ÷ (max − min).

Worked example: range 80,000–120,000 with midpoint 100,000; salary 92,000.
Compa-ratio = 92,000 ÷ 100,000 = **0.92**. Range penetration = 12,000 ÷ 40,000 = **30%**.

## Merit matrix
Annual increases often depend on both performance rating and compa-ratio: high performers low in range get the biggest increases.`,
          take: ['Evaluate jobs internally and price them externally', 'Compa-ratio = salary ÷ midpoint', 'Use a merit matrix to target increases fairly'],

        {
          id: '2', t: 'Benefits & total rewards', mins: 10,
          obj: ['Describe the total rewards model', 'Evaluate benefits by value and cost', 'Communicate total rewards'],
          body: `Total rewards is everything an employee gets from working for you that they value. Pay is only part of it.

## The WorldatWork total rewards model
- **Compensation** – base pay, variable pay, equity.
- **Benefits** – health, retirement, insurance, paid time off.
- **Wellbeing** – physical, mental, financial and social wellbeing support.
- **Development** – learning, career opportunities.
- **Recognition** – formal and informal appreciation.

## Choosing benefits
Ask three questions:
1. **Value** – do employees actually use and value it? Use surveys and utilisation data.
2. **Cost** – what is the cost per employee, and how will it grow?
3. **Market and compliance** – is it a legal requirement or market expectation?

Trends: flexible benefits platforms, mental health support, fertility and family-forming benefits, menopause support, financial wellbeing, lifestyle spending accounts, extended parental leave.

## Communicate it
Employees often underestimate the value of their package by a third or more. A **total rewards statement** showing salary, bonus, employer pension and insurance contributions, and benefit values helps retention.

> A benefit no one knows about is a cost with no return.`,

          id: '3', t: 'Building your first HR dashboard', mins: 13,
          obj: ['Select the right metrics for an audience', 'Design a clear dashboard', 'Turn metrics into insights'],
          body: `A dashboard is a tool for decisions. If no one changes a decision because of it, it is decoration.

## Pick the audience first
- **Executives** – headcount and cost trend, regretted attrition, critical roles open, engagement, diversity representation.
- **Managers** – their team’s absence, overdue reviews, open roles, leave balances.
- **HR team** – SLA performance, case volumes, data quality.

## Lead and lag indicators
- **Lag** – what already happened: attrition, absence.
- **Lead** – what predicts it: engagement scores, internal mobility, overdue 1:1s, time since last promotion.

## Design principles
- One page, five to eight metrics.
- Each metric shows: current value, trend, target and a red/amber/green status.
- Put the most important number top-left.
- Show trends with line charts, comparisons with bar charts. Avoid pie charts with many slices and 3D charts.
- Add a "so what" commentary box: what changed, why, and what action is recommended.

## From metric to insight
Metric: "Attrition rose to 18%."
Insight: "Attrition rose to 18%, driven by engineers with 1–2 years’ tenure in two teams. Exit interviews cite career progression. Recommend a career framework for engineering by Q2."

> Data → information → insight → action. Your value is in the last two steps.`,

  id: 'l3', code: 'L3', name: 'HR Business Partner & Manager',
  audience: 'HRBPs · HR managers · CoE specialists · 5–10 years',
  blurb: 'Partner with business leaders, design organisations, build talent pipelines, lead change and use people analytics to drive decisions.',
  modules: [
    {
      id: 'm1', title: 'The Strategic HR Business Partner',
      summary: 'Consulting skills, business acumen and the influence to change leaders’ minds.',
      lessons: [
        {
          id: '1', t: 'Consulting skills for HRBPs', mins: 14,
          obj: ['Use a consulting cycle with business clients', 'Diagnose the real problem behind a request', 'Contract clearly on outcomes'],
          body: `Leaders often bring HR a solution ("I need a team-building day", "Hire me two more people"). A great HRBP finds the problem first.

## The consulting cycle
1. **Entry and contracting** – understand the request, agree roles and outcomes.
2. **Diagnosis** – gather data, interview stakeholders, test hypotheses.
3. **Feedback** – share findings honestly, including uncomfortable ones.
4. **Intervention** – co-design and implement solutions.
5. **Evaluation and exit** – measure results and hand over ownership.

## Diagnose before prescribing
Ask "what would be different if this worked?" and "what have you already tried?" Use the **5 Whys** to get to the root cause.

Example: "My team needs time-management training."
- Why? They miss deadlines.
- Why? They are working on too many priorities.
- Why? Three directors assign work directly.
- Root cause: unclear prioritisation and governance, not individual skills.

## Contracting
Agree in writing (even an email):
- The business outcome and how success will be measured
- Scope and what is out of scope
- Roles: what the leader does, what HR does
- Timeline and check-in points

## The HRBP mindset
- Think in business outcomes, not HR programmes.
- Bring data and a point of view to every meeting.
- Say no, or "not yet", to work that will not move the needle.

> Your value is measured by the quality of the leader’s decisions, not the number of HR initiatives you launch.`,
          take: ['Diagnose before you prescribe', 'Use 5 Whys to find root causes', 'Contract on outcomes, scope and roles'],
          act: 'Take a recent request from a leader. Apply 5 Whys and write the contract email you should have sent.'
        },
        {
          id: '2', t: 'Business acumen: speaking the language of the P&L', mins: 15,
          obj: ['Read a profit and loss statement', 'Link people costs to business performance', 'Build a simple business case'],
          body: `To influence leaders you must understand how the business makes money and where people costs fit.

## The P&L in plain terms
| Line | Meaning |
|---|---|
| Revenue | Money from sales |
| Cost of goods sold (COGS) | Direct cost of producing what is sold |
| Gross profit | Revenue − COGS |
| Operating expenses (OpEx) | Salaries, rent, marketing, technology |
| EBITDA | Earnings before interest, tax, depreciation and amortisation |
| Net profit | What remains after all costs |

People costs often represent 30–70% of operating costs, depending on the industry. In services and technology, they are usually the largest cost.

## Useful people–finance metrics
- **Revenue per employee** = revenue ÷ FTE.
- **Profit per employee** = operating profit ÷ FTE.
- **Labour cost as % of revenue.**
- **Human capital ROI** = (revenue − (operating expenses − people costs)) ÷ people costs.

## A simple business case
1. **Problem** – quantify it. "Regretted attrition among 120 engineers is 22%, costing about $1.6m a year."
2. **Option** – what you propose and alternatives considered.
3. **Cost** – one-off and running.
4. **Benefit** – quantified, with assumptions stated.
5. **Risk and measures** – what could go wrong, how you will track success.

## Cost of attrition (rule of thumb)
Replacing an employee often costs between half and twice their annual salary, including recruitment, onboarding, lost productivity and manager time. Use your own data where possible.

> Learn your company’s top three strategic priorities and its biggest cost lines. Mention them in every proposal.`,
          take: ['Know your P&L and where people costs sit', 'Quantify problems in money and risk', 'Structure proposals as business cases'],
          act: 'Find your company’s revenue and headcount. Calculate revenue per employee and compare it with two competitors.'
        },
        {
          id: '3', t: 'Influencing senior stakeholders', mins: 12,
          obj: ['Map stakeholders by influence and interest', 'Use evidence and narrative to persuade', 'Handle resistance and challenge leaders'],
          body: `Influence is the HRBP’s core currency. You rarely have authority, so you must earn it.

## Stakeholder mapping
Plot stakeholders on a 2×2 grid of **influence** and **interest**:
- High influence, high interest → manage closely
- High influence, low interest → keep satisfied
- Low influence, high interest → keep informed
- Low influence, low interest → monitor

## Sources of influence
- **Expertise** – data, law, best practice.
- **Relationships** – trust built over time.
- **Reciprocity** – helping others with their priorities.
- **Framing** – positioning your proposal in their language and goals.

## Structure your message
Use the **pyramid principle**: lead with the recommendation, then three supporting arguments, then the data. Executives want the answer first.

"I recommend we delay the restructure by six weeks. Three reasons: legal consultation requirements, the risk of losing two key clients, and the Q4 delivery peak. Here’s the data…"

## Challenging a senior leader
- Do it privately and early.
- Use questions: "What would our customers see if we did this?"
- Name the risk factually: "This decision exposes us to a discrimination claim because…"
- Offer an alternative.
- If it is an ethical or legal issue, escalate when needed. That is part of the job.

> Leaders respect HRBPs who disagree well. They ignore those who always agree.`,

          act: 'Build a stakeholder map for a current HR initiative and plan one action for each quadrant.'
        }

          obj: ['Apply the Star Model to design choices', 'Analyse spans and layers', 'Compare structural options'],
          body: `Structure follows strategy. An organisation chart is the visible part of design, but processes, decision rights and incentives matter just as much.

## Galbraith’s Star Model
Five design levers that must align:
1. **Strategy** – direction and competitive advantage.
2. **Structure** – where power and decisions sit.
3. **Processes** – how information and decisions flow.
4. **Rewards** – how behaviour is motivated.
5. **People** – skills, mindsets, talent practices.

Change one point of the star without the others and the design fails.

## Structural options
| Structure | Strength | Watch out for |
|---|---|---|
| Functional | Deep expertise, efficiency | Silos, slow cross-functional work |
| Divisional (product, region, customer) | Market focus, accountability | Duplication, cost |
| Matrix | Balances two dimensions | Conflicting priorities, slow decisions |
| Network / team-of-teams | Speed, adaptability | Needs strong culture and clarity |

## Spans and layers
- **Span of control** – direct reports per manager. Narrow spans (2–4) add cost and slow decisions; wide spans (8–15) suit standardised work.
- **Layers** – levels between CEO and frontline. Fewer layers speed up decisions.

A span of control analysis often finds many managers with one or two reports. That is a sign of title inflation or unnecessary hierarchy.

## Decision rights
Use a **RACI** (Responsible, Accountable, Consulted, Informed) or **RAPID** (Recommend, Agree, Perform, Input, Decide) for key decisions. Unclear decision rights are the hidden cause of many "structure" problems.

> Start with design criteria: what must this organisation be great at? Then evaluate options against those criteria.`,

          id: '2', t: 'Strategic workforce planning', mins: 15,
          obj: ['Run a workforce planning cycle', 'Model supply and demand scenarios', 'Choose build, buy, borrow, bot or redeploy'],
          body: `Strategic workforce planning (SWP) makes sure the organisation has the right capabilities, in the right numbers, in the right places, at the right cost, over the next 1–5 years.

## The SWP cycle
1. **Understand strategy** – growth plans, new markets, products, automation.
2. **Segment roles** – focus on critical roles that drive strategy or are hard to fill.
3. **Analyse supply** – current headcount, skills, age profile, attrition, internal pipeline. Project forward.
4. **Forecast demand** – what roles and skills are needed under different scenarios.
5. **Gap analysis** – demand minus projected supply.
6. **Action plan** – close the gaps.
7. **Monitor** – review quarterly.

## Scenarios
Model at least three: base case, high growth, downturn. Include the impact of AI and automation, which may remove tasks rather than whole jobs.

## The 5 Bs for closing gaps
- **Build** – develop internal talent.
- **Buy** – hire externally.
- **Borrow** – contractors, gig workers, partners.
- **Bot** – automate with AI and technology.
- **Bridge / redeploy** – move people from declining roles to growing ones.

## Example
A bank expects 30% fewer branch roles and 40 additional data analysts in three years. Options: reskill 25 branch staff with analytical aptitude (build/bridge), hire 15 externally (buy), automate routine reporting (bot).

> Workforce planning is a business planning conversation, not an HR spreadsheet. Get finance and business leaders in the room.`,

          body: `Jobs change faster than job descriptions. A skills-based organisation treats skills, not jobs, as the core unit of talent decisions.

## Why it matters
- Widens talent pools by hiring for skills rather than degrees.
- Speeds up internal mobility: people can move to work that needs their skills.
- Makes learning investment targeted.
- Helps redeploy people as AI changes the task mix.

## Building blocks
1. **Skills taxonomy** – a structured list of skills, grouped into clusters (technical, business, leadership, human skills). Start with 150–300 skills, not 5,000.
2. **Proficiency levels** – for example 1 Awareness, 2 Working, 3 Practitioner, 4 Expert.
3. **Skills profiles** – which skills each role or work type requires.
4. **Skills data on people** – self-assessment, manager validation, inferred from work and learning (AI-assisted).
5. **Talent marketplace** – matching people to projects, gigs, mentors and roles.

## Using skills data
- **Hiring** – skills-based job ads and assessments.
- **Mobility** – recommend internal moves and gigs.
- **Learning** – personalised learning paths to close gaps.
- **Workforce planning** – forecast skill supply and demand.
- **Reward** – some firms pay premiums for critical skills.

## Pitfalls
Over-engineered taxonomies, unvalidated self-ratings, and treating it as a technology project. Start with one critical job family and prove value.

> Ask "what work needs doing and what skills does it need?" before asking "what job title should we hire?"`,

          obj: ['Facilitate a talent review', 'Distinguish performance from potential', 'Turn reviews into development actions'],
          body: `A talent review is a structured conversation where leaders discuss their people’s performance, potential and next steps.

## The 9-box grid
Performance (horizontal) against potential (vertical), each rated low, medium or high.

| | Low performance | Medium performance | High performance |
|---|---|---|---|
| **High potential** | Enigma / rough diamond | Growth employee | Future leader / star |
| **Medium potential** | Inconsistent | Core player | High performer |
| **Low potential** | Underperformer | Effective | Trusted professional |

## Defining potential
Potential is the likelihood of succeeding in bigger, more complex roles. Useful indicators:
- **Aspiration** – do they want more responsibility?
- **Ability** – learning agility, cognitive capacity, judgement.
- **Engagement** – commitment to the organisation.

Avoid confusing potential with performance, visibility, confidence or similarity to current leaders.

## Running the session
- Pre-work: managers propose placements with evidence.
- Discuss by group, starting with the high-potential and at-risk groups.
- Challenge with questions: "What evidence of learning agility have we seen?"
- Check distribution by gender, ethnicity and location.
- **Agree actions** for every person discussed: stretch assignment, coaching, move, retention plan or performance plan.

## After the review
Tell individuals about their development plans. Many companies avoid sharing labels like "high potential" but discuss growth opportunities openly.

> A talent review without development actions is just labelling.`,

          obj: ['Identify critical roles for succession', 'Assess successor readiness', 'Build a bench strength report'],
          body: `Succession planning makes sure the organisation can fill critical roles quickly and well when people leave or move.

## Which roles?
Not just the top team. Critical roles are those where a vacancy would cause significant business disruption: key leaders, scarce technical experts, roles holding key client relationships or regulatory licences.

## Readiness categories
- **Ready now** – could step in within 0–12 months.
- **Ready in 1–2 years.**
- **Ready in 3–5 years.**
- **Emergency cover** – could act temporarily.

Aim for at least two named successors per critical role, ideally including one diverse successor and one from outside the immediate team.

## Bench strength metrics
- % of critical roles with at least one ready-now successor
- Successor-to-role ratio
- % of critical roles filled internally
- Diversity of successor pools
- Successor retention rate

## Developing successors
Use experiences more than courses: acting assignments, cross-functional projects, international moves, board or committee exposure, mentoring by the incumbent, and leadership programmes linked to real work.

## Common failures
- Plans made once a year and never used
- Successors who are the same age as the incumbent
- "Mini-me" choices that reduce diversity of thought
- No external benchmarking when the internal bench is weak

> Test the plan: if this person left tomorrow, what would actually happen?`,

          obj: ['Explain drivers of engagement', 'Use surveys effectively', 'Design targeted retention actions'],
          body: `Engagement is the emotional commitment people have to their work and organisation. Engaged employees put in discretionary effort and stay longer.

## What drives engagement?
Research from Gallup, Qualtrics and others consistently points to:
- A good manager who cares and gives regular feedback
- Clear expectations and the tools to do the job
- Opportunities to grow
- Recognition
- Meaningful work and connection to purpose
- Fair pay and treatment
- Flexibility and reasonable workload
- Psychological safety: feeling able to speak up without fear

## Using surveys well
- Combine an annual census survey with short pulse surveys.
- Measure **eNPS**: "How likely are you to recommend this company as a place to work?" (0–10). eNPS = % promoters (9–10) − % detractors (0–6).
- Report at team level (minimum 5–7 responses to protect anonymity).
- **Act and communicate**: "You said, we did." Survey fatigue comes from inaction, not frequency.

## Targeted retention
Not all attrition is bad. Focus on **regretted attrition**: high performers, critical skills, diverse talent.

- **Flight-risk signals**: no promotion for a long time, low compa-ratio, manager change, low engagement, recent life events.
- **Stay interviews**: "What keeps you here? What might tempt you away?"
- **Actions**: career conversations, pay corrections, internal moves, flexible work, recognition.

## Worked example: eNPS
200 responses: 90 promoters, 70 passives, 40 detractors. eNPS = 45% − 20% = **+25**.

> People join companies and leave managers. Invest in manager capability first.`,

          obj: ['Apply Kotter and ADKAR', 'Plan change communications', 'Manage resistance'],
          body: `Most change efforts underdeliver, and the most commonly cited reason is the people side. HR’s job is to make change stick.

## Kotter’s 8 steps
1. Create urgency
2. Build a guiding coalition
3. Form a strategic vision
4. Enlist a volunteer army
5. Remove barriers
6. Generate short-term wins
7. Sustain acceleration
8. Institute change in the culture

## ADKAR (Prosci) – individual change
- **Awareness** of the need for change
- **Desire** to support it
- **Knowledge** of how to change
- **Ability** to implement new skills and behaviours
- **Reinforcement** to sustain it

Diagnose where people are stuck. Training (knowledge) will not help someone without desire.

## Change impact assessment
For each stakeholder group: what changes (process, tools, roles, location, reporting line), how big is the impact, and what support do they need?

## Communication
- Explain the **why** before the what.
- Managers are the preferred source of change messages. Equip them with briefing packs and FAQs.
- Repeat key messages through several channels.
- Create two-way channels: Q&A sessions, pulse checks.

## Resistance
Resistance is information. Common causes: fear of loss (status, job, competence), lack of trust, poor timing, change fatigue. Listen, involve people in design, and address concerns honestly.

> Change happens one person at a time. Plan for the organisation, but support individuals.`,

          id: '2', t: 'Diagnosing & shaping culture', mins: 13,
          obj: ['Define culture in observable terms', 'Diagnose culture with multiple methods', 'Use HR levers to shape behaviour'],
          body: `Culture is "how things really get done around here": the shared beliefs and behaviours that shape decisions when no one is watching.

## Schein’s three levels
1. **Artefacts** – visible: office layout, dress, rituals, language.
2. **Espoused values** – what the company says it values.
3. **Basic assumptions** – deep, unspoken beliefs that actually drive behaviour.

Problems arise when espoused values ("we value collaboration") contradict assumptions ("individual heroes get promoted").

## Diagnosis methods
- Engagement and culture survey data
- Focus groups and interviews: "What gets you promoted here? What gets you in trouble?"
- Analysis of who gets promoted, rewarded and exited, and why
- Organisational network analysis of how collaboration actually flows
- Glassdoor and exit interview themes

## Shaping culture through HR levers
| Lever | Example |
|---|---|
| Hiring | Assess for values-in-action, not "culture fit" |
| Onboarding | Teach norms explicitly |
| Performance | Rate the "how" alongside the "what" |
| Reward & promotion | Promote role models of desired behaviour |
| Leadership | Leaders model behaviours visibly |
| Exits | Act on toxic high performers |
| Rituals & symbols | Recognition, storytelling, meeting norms |

## Culture add, not culture fit
"Culture fit" often means hiring people like us. "Culture add" asks: does this person share our core values and bring something we lack?

> Culture is shaped by the worst behaviour a leader tolerates.`,
          take: ['Culture lives in assumptions, not posters', 'Diagnose using data on who gets rewarded', 'Use every HR lever consistently'],

          id: '3', t: 'People analytics: from reports to predictions', mins: 15,
          obj: ['Describe the analytics maturity model', 'Frame good analytics questions', 'Apply ethical guardrails'],
          body: `People analytics uses data about people and work to improve decisions. It moves from describing what happened to predicting and shaping what will happen.

## Maturity levels
1. **Operational reporting** – headcount, turnover reports.
2. **Advanced reporting** – dashboards, benchmarking, trends.
3. **Diagnostic analytics** – why did it happen? Segmentation, correlation.
4. **Predictive analytics** – what will happen? Attrition risk models, hiring success prediction.
5. **Prescriptive** – what should we do? Recommendations, scenario modelling, AI-driven nudges.

## Start with a business question
Weak: "What can our data tell us?"
Strong: "Which factors predict whether a new sales hire reaches quota within 12 months?"

## A simple project approach
1. Define the question and decision with the business owner.
2. Form hypotheses.
3. Gather and clean data (HRIS, ATS, LMS, survey, performance, sales).
4. Analyse: start simple (cross-tabs, regression) before machine learning.
5. Tell the story: insight, impact, recommendation.
6. Act and measure.

## Correlation is not causation
Employees who attend more training have lower attrition. Does training reduce attrition, or do engaged people attend more training? Use control groups and pilots where possible.

## Ethics and trust
- Transparency: tell employees what data is used and why.
- Aggregate wherever possible; protect individuals.
- Do not use predictive scores to make automated decisions about individuals without human review.
- Check models for bias against protected groups.
- Comply with privacy laws and the EU AI Act where relevant.

> Analytics earns its place when a leader makes a better decision because of it.`,

## Limits of the classic model
- HRBPs pulled into transactional work
- CoEs designing programmes disconnected from business needs
- Employees bounced between channels
- Handoffs create slow, fragmented experiences

## Emerging models
- **Agile / product-based HR** – cross-functional HR teams own end-to-end experiences (for example "hire to productive") as products with a product owner and backlog.

- Expertise depth
- Cost and scalability
- Compliance and risk control

## Transition

          obj: ['Build and defend an HR budget', 'Calculate ROI for HR programmes', 'Prioritise investments'],
          body: `HR leaders manage large budgets, both HR’s own operating costs and the people costs of the whole organisation. Financial discipline builds credibility.

## Two budgets
1. **HR function budget** – HR salaries, technology, learning, recruitment, consultants, events.
2. **Enterprise people cost** – salaries, bonuses, benefits, payroll taxes, hiring. Usually owned by business units, but HR often owns the planning process and assumptions (merit budget, headcount plan, benefit inflation).

## ROI formula
**ROI = (benefits − costs) ÷ costs × 100**

Example: a manager development programme costs $200,000. It reduces regretted attrition in participating teams from 15% to 11% across 400 employees. Average replacement cost is $40,000.
Avoided leavers: 4% of 400 = 16. Benefit: 16 × $40,000 = $640,000.
ROI = ($640,000 − $200,000) ÷ $200,000 = **220%**.

Be explicit about assumptions and use control groups where possible. Present a range rather than a single number.

## Prioritising investments
Score options on:
- Strategic alignment
- Expected value (financial and risk reduction)
- Cost and effort
- Time to impact
- Confidence in results

## Cost levers when budgets tighten
Process automation, vendor consolidation, self-service, reducing low-value programmes, shared services location strategy, and renegotiating benefit contracts, before cutting capability-building programmes that drive future value.

> Speak the CFO’s language: cost, value, risk and payback period.`,

          obj: ['Write a reward philosophy', 'Choose a market position by role', 'Balance fixed and variable pay'],
          body: `A reward philosophy sets the principles behind every pay decision. Without one, decisions become ad hoc and inconsistent.

## Elements of a reward philosophy
- **Purpose** – what reward should achieve (attract, retain, motivate, align to strategy).
- **Market position** – where we pay against the market (for example median base, upper-quartile total cash for top performers).
- **Comparator market** – who we compete with for talent: industry, geography, company size.
- **Mix** – balance of fixed pay, short-term incentives, long-term incentives and benefits.
- **Performance link** – how strongly pay differentiates by performance.
- **Internal equity and transparency** – how open we are about pay ranges and decisions.

## Differentiated positioning
Not every role needs the same market position. Many firms pay:
- Market median for most roles
- Upper quartile for critical, scarce skills (AI, cybersecurity, specialised engineers)
- Geographic differentials for remote roles, or a single national rate

## Pay mix by level
| Level | Typical fixed : variable |
|---|---|
| Individual contributor | 90 : 10 |
| Manager | 80 : 20 |
| Senior leader | 60 : 40 |
| Executive | 30–40 : 60–70 (including LTI) |
| Sales roles | 50 : 50 to 70 : 30 |

## Affordability
Model the total cost of changes. A 1% merit budget increase may cost millions. Link the reward budget to business performance and the workforce plan.

> A good philosophy lets a line manager explain any pay decision in one sentence.`,

          body: `Incentives focus attention. Badly designed incentives focus attention on the wrong things.

## Short-term incentives (STI / annual bonus)
Key design choices:
- **Eligibility and target** – e.g. 10% of salary for managers, 30% for directors.
- **Funding** – company performance creates the pool (e.g. EBITDA vs target).
- **Measures** – a balanced mix of financial (revenue, profit, cash), customer, operational and people/ESG measures. Usually 3–5 measures.
- **Performance curve** – threshold (e.g. 90% of target pays 50%), target (100% pays 100%), stretch (110% pays 200%).
- **Individual modifier** – adjusts payout by individual performance.

## Long-term incentives (LTI)
Align leaders with shareholders over 3+ years.
| Vehicle | How it works |
|---|---|
| Restricted stock units (RSUs) | Shares vest over time; retention focus |
| Performance shares (PSUs) | Vest only if targets met (TSR, EPS, ROIC) |
| Stock options | Right to buy at a fixed price; value only if share price rises |
| Cash LTIP | For private companies or subsidiaries |
| Phantom equity / profit pools | For private companies wanting equity-like alignment |

## Governance
- **Malus and clawback** – reduce or recover awards after misconduct or misstatement.
- **Shareholding requirements** – executives hold shares worth a multiple of salary.
- **Discretion** – boards can adjust outcomes that do not reflect real performance.

## Unintended consequences
Sales incentives on revenue alone can drive discounting and mis-selling. Call-centre targets on call time can hurt customer outcomes. Always ask: "How could someone hit this target while hurting the business?"

> Simple plans that people understand outperform clever plans they don’t.`,

          body: `Pay transparency is now law in many places. The EU Pay Transparency Directive must be transposed into national law by June 2026, and many US states require pay ranges in job postings.

## Key requirements of the EU Pay Transparency Directive
- Pay range or starting pay disclosed to candidates before interview.
- Ban on asking candidates for their pay history.
- Employees can request information on their pay level and the average pay of colleagues doing the same work or work of equal value, broken down by sex.
- Gender pay gap reporting: annually for employers with 250+ employees, with phased reporting for 100–249.
- If a gap of **5% or more** in any category of workers cannot be justified by objective, gender-neutral factors and is not fixed within six months, a **joint pay assessment** with worker representatives is required.
- The burden of proof shifts to the employer in pay discrimination claims.

## Gender pay gap vs equal pay
- **Pay gap** – difference in average pay between men and women across the organisation. Often driven by representation (fewer women in senior roles).
- **Equal pay** – equal pay for equal work or work of equal value. Unexplained differences here are unlawful.

## Running a pay equity analysis
1. Group jobs by work of equal value (job architecture and evaluation are essential).
2. Gather pay data: base, bonus, allowances, equity.
3. Run regression analysis controlling for legitimate factors: grade, role, location, tenure, performance.
4. Identify unexplained gaps by gender, and by ethnicity where lawful.
5. Investigate outliers individually.
6. Remediate: budget for adjustments, fix root causes (starting pay, promotion, bonus decisions).
7. Repeat annually; analyse under legal privilege where advised.

## Preparing for transparency
Clean job architecture, defensible pay ranges, manager training on pay conversations, and a communication plan.

> Transparency exposes every inconsistency. Fix the system before you open the window.`,

| | Suite | Best-of-breed |
|---|---|---|

          body: `Generative and agentic AI are reshaping HR work. The opportunity is large; so is the responsibility, because HR decisions affect people’s livelihoods.

## EU AI Act and HR
AI systems used for recruitment, selection, promotion, termination, task allocation and performance monitoring are classified as **high-risk**. Core obligations for high-risk systems apply from August 2026, although EU lawmakers have discussed adjusting the timeline, so check the current position. Requirements include:
- Risk management and data governance
- Human oversight
- Transparency to affected workers
- Logging and monitoring
- Informing workers’ representatives before deployment (for employers)

**Prohibited practices** include emotion recognition in the workplace (except for medical or safety reasons). AI literacy obligations already apply.

Other regulations: NYC Local Law 144 (bias audits for automated hiring tools), Colorado’s AI Act, Illinois laws on AI in employment decisions, and evolving guidance elsewhere.

## AI governance in HR
1. **Inventory** every AI tool in use, including those embedded in vendor products.

## Due diligence: people questions

- Pension and benefit liabilities

          body: `Restructuring is sometimes necessary. How it is done determines legal risk, reputation and the commitment of the people who stay.

## Before deciding
- Is there a clear business rationale? Document it.
- Have alternatives been considered: hiring freeze, reduced hours, redeployment, voluntary programmes?
- What is the full cost, including severance, legal, rehiring and lost productivity?

## Legal process (varies by jurisdiction)
- **Collective consultation** with worker representatives or unions when thresholds are met (for example the EU Collective Redundancies Directive; UK rules at 20+ redundancies; WARN Act in the US for mass layoffs with 60 days’ notice).
- Notification to authorities where required.
- Individual consultation.
- Fair and objective selection.
- Consideration of suitable alternative roles.
- Statutory and contractual severance.

## Selection criteria
Objective, measurable and documented: skills, performance (with reliable records), qualifications, disciplinary record. Avoid criteria that indirectly discriminate. Check the impact on protected groups before finalising.

## Doing it with dignity
- Inform affected people personally, not by mass email.
- Train managers to deliver the news.
- Provide outplacement, career coaching, mental health support and references.
- Be generous where possible. Leavers talk to future candidates and customers.

## Survivors
Survivor syndrome includes reduced trust, anxiety and lower productivity. Explain the future plan, re-set priorities and workload, and have leaders be visible and honest.

## Labour relations
Trade unions, works councils and employee forums are partners in many countries. In much of Europe, works councils have legal rights to information, consultation and sometimes co-determination.

Principles for a constructive relationship:
- Share information early and honestly.
- Meet regularly, not only during disputes.
- Understand representatives’ pressures and constituents.
- Keep commitments.

## Collective bargaining preparation
- Know the business’s financial position and the cost of each proposal.
- Understand market and peer agreements.
- Define your objectives, opening position and walk-away point.
- Build a negotiating team with clear authority.
- Plan communications to employees throughout.
- Use interest-based bargaining: focus on underlying interests rather than fixed positions.

## Crisis leadership
Crises include pandemics, natural disasters, cyberattacks, workplace violence, executive misconduct and sudden financial shocks.

HR’s role:

          body: `The CHRO is one of the few executives who sees the whole enterprise through its people: every function, every leader, every risk. The best CHROs act as enterprise leaders first and heads of HR second.

## Three roles of the CHRO
1. **Enterprise leader** – shapes strategy, capital allocation and transformation as a full member of the executive team.
2. **Talent and culture steward** – owns the leadership bench, culture, organisation health and top-team effectiveness.
3. **Head of the HR function** – runs an efficient, digital, value-adding HR organisation.

## The G3
In many companies the CEO, CFO and CHRO form a core decision-making group (the "G3") on strategy, talent and resource allocation. Ram Charan, Dominic Barton and Dennis Carey argued that putting talent on par with capital is a source of advantage.

- Be the CEO’s **truth-teller**: the person who reports what others won’t, including about the CEO.

- Bring an **independent, enterprise view**, not just HR’s interests.
- Keep confidences scrupulously.

- Culture and trust in hybrid, distributed organisations

          body: `CEO succession is the board’s most important decision, and the CHRO is usually its key executive architect.

## A rigorous CEO succession process
1. **Start early** – a living process, 3–5 years ahead of the expected transition.
2. **Define the future role** – based on strategy, not the incumbent. What challenges will the next CEO face?
3. **Create a success profile** – experiences, capabilities, leadership attributes.
4. **Identify internal candidates** and benchmark them externally.
5. **Develop candidates** with stretch assignments, board exposure, coaching.
6. **Assess** using multiple sources: performance track record, structured interviews, psychometric and leadership assessment, 360 feedback, board observation.
7. **Emergency plan** – who steps in tomorrow if needed.
8. **Transition** – onboarding, role of the outgoing CEO, communication to markets and employees.

The board owns the decision. The CHRO manages the process, keeps it objective and confidential, and manages the outgoing CEO relationship sensitively.

## Top-team effectiveness
An executive team of strong individuals is not automatically a strong team. Assess:
- **Clarity** – shared purpose and priorities
- **Composition** – right capabilities and diversity
- **Collective accountability** – enterprise goals over functional interests
- **Dynamics** – trust, constructive conflict, decision quality
- **Rhythm** – meetings focused on strategic decisions, not reports

Interventions: offsite work on purpose and operating norms, team coaching, changing incentives towards enterprise goals, and changing members when necessary.

## Executive transitions
Most new senior executives who fail do so because of poor fit and relationships, not technical skill. Support every executive appointment with a structured onboarding and a 90-day plan.

> Never let the CEO choose their own successor alone. The board decides; HR ensures rigour.`,

          body: `Culture shows up in strategy execution, innovation, customer outcomes, conduct risk and reputation. Many corporate scandals trace back to cultures where people felt unable to speak up.

## Culture and performance
Healthy cultures combine high performance standards with high care: accountability with psychological safety. Research by Amy Edmondson and Google’s Project Aristotle highlighted psychological safety as a key factor in team effectiveness.

## Enterprise culture metrics
- Engagement and enablement scores
- Psychological safety and speak-up indicators
- Whistleblowing volumes, themes and closure times (very low volumes can signal fear, not health)
- Misconduct cases and outcomes, including for senior people
- Values-based behaviour ratings in performance reviews
- Inclusion index
- Customer and employee sentiment, including external reviews
- Regretted attrition and internal mobility

Present a **culture dashboard** to the board at least annually.

## Leading culture transformation
1. **Define the target culture** in specific behaviours linked to strategy ("we make decisions at the lowest level with the right information").
2. **Leaders go first** – the top team models and is held accountable.
3. **Align systems** – hiring, promotion, reward, performance, structure.
4. **Symbolic acts** – visible decisions that signal the change (e.g. exiting a high performer who violated values).
5. **Stories and rituals** – recognise people who exemplify the culture.
6. **Measure and iterate.**

## Culture and reputation
In a world of social media and employee review sites, internal culture is visible externally. Employer reputation affects customers, investors and regulators.

> The board should hear about culture risk from the CHRO before reading about it in the press.`,

          id: '3', t: 'The future of work: humans + AI agents', mins: 16,
